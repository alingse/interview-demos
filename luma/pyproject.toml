[project]
name = "luma"
version = "0.1.0"
description = "Anime metadata incremental processing pipeline"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.19.0",
    "rapidfuzz>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
luma = "luma.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
